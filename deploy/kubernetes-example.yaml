apiVersion: v1
kind: Namespace
metadata:
  name: container-updater
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: container-updater-sa
  namespace: container-updater
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: container-updater-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: container-updater-binding
subjects:
  - kind: ServiceAccount
    name: container-updater-sa
    namespace: container-updater
roleRef:
  kind: ClusterRole
  name: container-updater-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: container-updater-config
  namespace: container-updater
data:
  PORT: "8080"
  DATABASE_PATH: "/app/data/db.sqlite"
  LOG_LEVEL: "info"
  CRON_SCHEDULE: "*/15 * * * *"
  APPRISE_API_URL: "http://apprise-api.container-updater.svc.cluster.local:8000"
  OIDC_ENABLED: "false"
  OIDC_ISSUER: ""
  OIDC_PROVIDER_URL: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-updater-backend
  namespace: container-updater
  annotations:
    container-updater.enable: "true"
  labels:
    app.kubernetes.io/name: container-updater-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: container-updater-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: container-updater-backend
      annotations:
        container-updater.enable: "true"
    spec:
      serviceAccountName: container-updater-sa
      containers:
        - name: backend
          image: ghcr.io/giacomoranieri/container-updater-backend:beta
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: container-updater-config
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
      volumes:
        - name: data-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: container-updater-backend
  namespace: container-updater
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: container-updater-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-updater-frontend
  namespace: container-updater
  annotations:
    container-updater.enable: "true"
  labels:
    app.kubernetes.io/name: container-updater-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: container-updater-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: container-updater-frontend
      annotations:
        container-updater.enable: "true"
    spec:
      containers:
        - name: frontend
          image: ghcr.io/giacomoranieri/container-updater-frontend:beta
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_BACKEND_URL
              value: "http://container-updater-backend.container-updater.svc.cluster.local:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: container-updater-frontend
  namespace: container-updater
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/name: container-updater-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: container-updater-ingress
  namespace: container-updater
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: container-updater.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: container-updater-frontend
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: container-updater-backend
                port:
                  number: 8080
---
# Example Monitored Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-app
  namespace: default
  annotations:
    container-updater.enable: "true"
  labels:
    app: example-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-app
  template:
    metadata:
      labels:
        app: example-app
      annotations:
        container-updater.enable: "true"
    spec:
      containers:
        - name: web
          image: nginx:latest
          ports:
            - containerPort: 80
