version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: container-updater-backend:latest
    container_name: container-updater-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_PATH=/app/data/db.sqlite
      - LOG_LEVEL=info
      - CRON_SCHEDULE=*/15 * * * *
      - APPRISE_API_URL=http://apprise-api:8000
      - OIDC_ENABLED=false # Set to true and configure OIDC_ISSUER etc. to enable authentication
      - COMPOSE_PATH_MAP=/host/path/to/compose/files:/app/manifests
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/app/data
      - ./manifests:/app/manifests
      - ./gitops:/app/gitops
    depends_on:
      - apprise-api
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: container-updater-frontend:latest
    container_name: container-updater-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

  apprise-api:
    image: caronc/apprise-api:latest
    container_name: container-updater-apprise
    ports:
      - "8000:8000"
    restart: unless-stopped
