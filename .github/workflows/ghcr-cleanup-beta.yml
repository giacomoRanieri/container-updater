name: GHCR Retention Cleanup (Beta & Untagged)

on:
  schedule:
    - cron: '0 2 * * *' # Run daily at 02:00 UTC
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  cleanup-old-betas:
    name: Cleanup Old Beta & Untagged Container Images
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup Backend Package Versions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const packageNames = ['container-updater-backend', 'container-updater-frontend'];

            for (const pkg of packageNames) {
              console.log(`Checking package ${pkg} for old beta versions...`);
              let versions = [];
              try {
                const res = await github.rest.packages.getAllPackageVersionsForUser({
                  package_type: 'container',
                  username: owner,
                  package_name: pkg
                });
                versions = res.data;
              } catch (err) {
                console.log(`Skipping package ${pkg}: ${err.message}`);
                continue;
              }

              // Filter versions that only have beta-<sha> or untagged, keeping :beta and release tags (:latest, :v*)
              const shaBetaVersions = versions.filter(v => {
                const tags = v.metadata?.container?.tags || [];
                if (tags.length === 0) return true; // untagged
                const isProtected = tags.some(t => t === 'beta' || t === 'latest' || t.startsWith('v'));
                return !isProtected;
              });

              // Keep the 5 most recent sha beta versions, delete older ones
              const versionsToDelete = shaBetaVersions.slice(5);

              for (const ver of versionsToDelete) {
                const tags = ver.metadata?.container?.tags || [];
                console.log(`Deleting old version ${ver.id} (tags: [${tags.join(', ')}])...`);
                try {
                  await github.rest.packages.deletePackageVersionForUser({
                    package_type: 'container',
                    username: owner,
                    package_name: pkg,
                    package_version_id: ver.id
                  });
                } catch (err) {
                  console.log(`Failed to delete version ${ver.id}: ${err.message}`);
                }
              }
            }
